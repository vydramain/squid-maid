# The template of one ball body, loaded once per body under pose_yaw (src/squid-scene.hpp, squid_scene_body_spawn).
# The model is set after the load; the name is a placeholder. Values are in scene units (the game's world units) and
# degrees; scale 1.0 is the unscaled size.
# Scale 0.75: each model fits inside a sphere of its size's old radius, 4/3 of the physical radius in src/squid-params.hpp,
# so the template shrinks it to its body; a new model is made to fit inside 4/3 of its body radius.

[scene]
version = "2.0"

[[object]]
id = "7a600001"
parent = ""

[[component]]
object = "7a600001"
name = "name"
text = "body"

[[component]]
object = "7a600001"
name = "transform"
scale = [0.75, 0.75, 0.75]

[[component]]
object = "7a600001"
name = "model"
source = "m4_satellite.gltf"
