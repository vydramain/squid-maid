# The scene of the squid-maid prototype. The tilt root sits at the dome centre
# (SQUID_DOME_CENTER in src/squid-params.hpp, -0.012 -0.974 -0.059) with scale 1 and no parent; the disc writes its
# rotation each frame, so the whole posed dome tilts with the game. Under the tilt root, pose_pitch is 0 (the structure
# stands level, plate horizontal) and pose_yaw turns -30 deg about the plate normal, at scale 1; the pitch group stays
# so the yaw keeps its place under it. The balls load under pose_yaw: they take the pose rotation, not the scale. The
# structure hangs under pose_scale, which scales it 1.25 about the dome centre; the dome radius is sized for that.
# The children are offset by minus the dome centre, so the scale turns and scales them about the dome centre.
# Values are in scene units (the game's world units) and degrees; scale 1.0 is the unscaled size.
# The three elephants stand in a row (x = -1.1, 0, 1.1; z = 0) on the turtle, whose shell is scaled 2.5 x 0.3 x 1.4
# (its top at y = -1.85). Each foot sits 0.00 to 0.03 into the shell, none hangs over it. The feet are at y = -1.9 and
# the model is 1.6 high, so the backs touch the plate's underside at y = -0.3. The turtle's origin is at y = -2.12.

