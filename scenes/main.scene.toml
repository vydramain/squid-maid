# The scene of the squid-maid prototype (docs/disdoc.md, sections 6, 10, 15.2). The tilt root sits at the origin with
# scale 1 and no parent; the disc writes its rotation each frame. Alkoldun's position is also written each frame.
# Values are Q20.12 (4096 = 1.0). The debris positions are set by code (squid_scene_place_debris: the target of each
# junk object, in sequence order), so the positions of the junk objects below are placeholders.
# The three elephants stand in a row (x = -1.1, 0, 1.1; z = 0) on the turtle, whose shell is scaled 2.5 x 0.3 x 1.4
# (its top at y = -1.85). Each foot sits 0.00 to 0.03 into the shell, none hangs over it. The feet are at y = -1.9 and
# the model is 1.6 high, so the backs touch the plate's underside at y = -0.3. The turtle's origin is at y = -2.12.

[scene]
version = "1.1"

[[object]]
id = "7a500001"
name = "tilt"
parent = ""
kind = "group"
position = [0, 0, 0]
rotation = [0, 0, 0]
scale = [4096, 4096, 4096]
mesh = ""
texture = ""

[[object]]
id = "7a500002"
name = "earth"
parent = "7a500001"
kind = "mesh"
position = [0, 0, 0]
rotation = [0, 0, 0]
scale = [4096, 4096, 4096]
mesh = "earth.gltf"
texture = ""

# The plate is drawn in the decal window, nearer than the models under it: it covers the elephants and the part of
