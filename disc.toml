[disc]
id = "squid-maid"
title = "squid-maid"

[build]
sources = ["src/*.cpp"]
# Without the SDK kit, #include "pdkkit/..." is not found.
sdk = ["kit"]

[assets]
# Sorted by extension: scenes are copied as they are, the effect .wav files are baked to .pcm and stay in sound memory,
# the .gltf models are baked to .mppcmod.
files = ["scenes/*.scene.toml", "assets/snd/sfx_*.wav", "assets/models/*.gltf"]

[assets.texture]
# Format the PNG textures named in the .gltf files are baked to; there are no separate textures yet.
format = "idx8"

[assets.stream]
# The six looping music sections, 24-bit WAV, are baked at burn to headerless S16LE mono 44100 Hz .pcm files that the
# drive streams; they are not loaded into sound memory.
files = ["assets/snd/mus_*.wav"]

[budget.pcca]
# 1 MiB, as Solid Maid and example-cpp declare: the 15 effect sounds take 356918 bytes of baked PCM;
# the music streams from the drive and takes no sound memory.
# voice_count stays at its default 24.
sound_memory_size = 1048576

[budget.pccg]
# Recognizable old-tech models at 160/80/40/20 triangles; the worst frame is about 2190 (balls 1600 + structure 430 +
# Alkoldun 160), so 4096 leaves headroom over the 2048 default.
triangle_capacity = 4096

[budget.pccv]
# Twice triangle_capacity: rv_cg_model_put splits a triangle cut by the near plane into two primitives,
# as the defaults do; nothing checks the 2:1 ratio, so it is kept by hand.
frame_capacity = 8192
