[disc]
id = "squid-maid"
title = "squid-maid"

[build]
sources = ["src/*.cpp"]

[assets]
files = ["scenes/*.scene.toml"]

[sounds]
# Effects only: they stay resident in sound memory. The music is in [music], not here.
files = ["assets/snd/sfx_*.wav"]

[music]
# The six looping sections, 24-bit WAV, baked at burn to headerless S16LE mono 44100 Hz "<stem>.pcm" drive assets, read
# whole by the game (not in sound memory). The game plays them in its playlist order (src/squid-ambient.hpp).
files = ["assets/snd/mus_*.wav"]

[textures]
# No separate textures yet; format is still required by [models].
files = []
format = "idx8"

[models]
files = ["assets/models/*.gltf"]

[budget.pcca]
# Over the default 512 KiB: 15 effect sounds (356918 bytes of baked PCM) and the ambient's two 1-second slots (176400 bytes).
# Solid Maid and example-cpp declare the same 1 MiB. voice_count stays at its default 24; squid plays on voices 1 and 2.
sound_memory_size = 1048576

[budget.pccg]
# Recognizable old-tech models at 160/80/40/20 triangles; the worst frame is about 2190 (balls 1600 + structure 430 +
# Alkoldun 160), so 4096 leaves headroom over the 2048 default.
triangle_capacity = 4096

[budget.pccv]
# Twice triangle_capacity: rv_cg_model_put splits a triangle cut by the near plane into two primitives,
# as the defaults do; nothing checks the 2:1 ratio, so it is kept by hand.
frame_capacity = 8192
