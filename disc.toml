[disc]
id = "squid-maid"
title = "squid-maid"

[build]
sources = ["src/*.cpp"]
# Without the SDK kit, #include "pdkkit/..." is not found.
sdk = ["kit"]

[assets]
# Sorted by extension: scenes are copied as they are, the effect .wav files are baked to .pcm and stay in sound memory,
# the .gltf models are baked to .mppcmod.
files = ["scenes/*.scene.toml", "assets/snd/sfx_*.wav", "assets/models/*.gltf"]

[assets.texture]
# Format the PNG textures named in the .gltf files are baked to; there are no separate textures yet.
format = "idx8"

[assets.stream]
# The six looping music sections, 24-bit WAV, are baked at burn to headerless S16LE mono 44100 Hz .pcm files that the
# drive streams; they are not loaded into sound memory.
files = ["assets/snd/mus_*.wav"]

[touch_pad]
# On a phone the pad shows the D-pad and face buttons and gives the game the phone's motion; pause (View) is hidden
# on purpose.
show = ["dpad", "face", "gyro"]

[budget.pcca]
# 512 KiB: the 15 effect sounds take 356918 bytes of baked PCM, so the capacity is about 47% above them.
# The music streams from the drive and takes no sound memory. voice_count stays at its default 24.
sound_memory_size = 524288

[budget.pccg]
# Worst frame 2052 triangles: balls 1120 (56 mass units at about 20 triangles each; the refrigerator costs fewer
# triangles per mass unit, 138 for 8 units, about 17 against 20), 16 bottles x 20 = 320, structure 430 (earth 12,
# three elephants 100 each, turtle 118), Alkoldun with flame 182.
# 3072 leaves about half again as much headroom.
triangle_capacity = 3072

[budget.pccv]
# Twice triangle_capacity: rv_cg_model_put splits a triangle cut by the near plane into two primitives, as the
# defaults do. tests/check-budgets.py checks the 2:1 ratio and recomputes the worst frame from the assets.
frame_capacity = 6144
